let n=0,cut=0;[...doc.body.children].forEach(c=>{n+=c.outerHTML.length;if(n>90000){c.remove();cut=1}});
return{text:doc.body.textContent.replace(/\s+/g,' ').slice(0,3000),html:doc.body.innerHTML+(cut?'<p><i>README truncated. Read the full file on GitHub.</i></p>':'')}}
function classify(d){const t=[d.repo.description,...d.topics,d.repo.name,(d.readme||'').slice(0,1500)].join(' ').toLowerCase();let best='',bs=0;
for(const[c,re]of Object.entries(KW)){const g=new RegExp(re.source,'g'),s=(t.match(g)||[]).length+(d.topics.some(x=>re.test(x))?3:0);if(s>bs){bs=s;best=c}}
return best||(d.repo.license?'Open Source':'Other')}
function vm(p){const d=C[key(p)]||{},r=d.repo||{};let h=p.demo||r.homepage||'';if(h&&!/^https?:/i.test(h))h='https://'+h;
return{...p,d,r,desc:p.desc||r.description||'No description provided.',cat:p.cat||(d.repo?classify(d):'Other'),demo:/^https?:\/\//i.test(h)?h:'',lang:r.language||'',techs:[...new Set([...Object.keys(d.langs||{}),...(d.topics||[]),...(p.tags||[])])]}}
const thumb=x=>{const s=safe(x.thumb);if(s)return`<div class="th"><img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()"></div>`;const R=x.r||{};
return`<div class="th term" aria-hidden="true"><div class="chrome"><i></i><i></i><i></i><span>github.com/${esc(x.owner)}/${esc(x.repo)}</span></div><div class="tl">${[['repo',x.repo],['owner',x.owner],['lang',x.lang||'n/a'],['stars',num(R.stargazers_count)],['branch',R.default_branch||'main']].map(a=>`<div><em>${a[0]}</em> <b>${esc(a[1])}</b></div>`).join('')}<div class="cur">$ ▍</div></div></div>`};
const ext=(h,t,c='btn')=>`<a class="${c}" target="_blank" rel="noopener noreferrer" href="${esc(h)}">${t}</a>`;
const card=(x,pv)=>`<article class="card reveal"><a class="thw" href="#/p/${x.owner}/${x.repo}">${thumb(x)}</a><div class="cb"><div class="row"><span class="chip">${esc(x.cat)}</span><span class="sp"></span>${x.feat?'<span class="star" title="Featured">★</span>':''}${pv?'':`<button class="ic ${x.fav?'on':''}" data-a="fav" data-k="${key(x)}" title="Favourite">♥</button>`}</div>
<h3><a href="#/p/${x.owner}/${x.repo}">${esc(x.repo)}</a></h3><div class="own">by ${esc(x.owner)}</div><p>${esc(x.desc)}</p><div class="tags">${x.techs.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
<div class="meta">${x.lang?`<span><i class="dot" style="background:${lc(x.lang)}"></i>${esc(x.lang)}</span>`:''}<span>★ ${num(x.r.stargazers_count)}</span><span>⑂ ${num(x.r.forks_count)}</span><span title="${fdate(x.r.pushed_at)}">Updated ${ago(x.r.pushed_at||x.r.updated_at)}</span></div>
<div class="acts">${ext(x.url,'VIEW PROJECT','btn pri')}${x.demo?ext(x.demo,'LIVE DEMO'):'<span class="nodemo">No live demo</span>'}</div></div></article>`;
const opt=(v,cur,l)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l||v)}</option>`;
// ---- Gallery
function gallery(){const techs=[...new Set(P.map(vm).flatMap(x=>x.techs))].sort();
if(!P.length){app.innerHTML=`<h1>Project Vault</h1><div class="empty"><p>Your vault is empty. Paste a GitHub URL to showcase your first project.</p><a class="btn pri" href="#/add">ADD PROJECT</a></div>`;return}
app.innerHTML=`<span class="pill-badge"><i class="live"></i>Live from GitHub</span><h1>Project Vault</h1><p class="sub">${P.length} project${P.length>1?'s':''} showcased from GitHub. Every one still lives in its original repository.</p>
<div class="bar"><input id="q" type="search" placeholder="Search projects…" value="${esc(UI.q)}"><select id="fc"><option value="">All categories</option>${CATS.map(c=>opt(c,UI.cat)).join('')}</select><select id="ft"><option value="">All technologies</option>${techs.map(c=>opt(c,UI.tech)).join('')}</select>
<select id="fs">${[['stars','Most stars'],['new','Newest added'],['upd','Recently updated'],['manual','My order']].map(a=>opt(a[0],UI.sort,a[1])).join('')}</select><select id="fv">${[['','All projects'],['feat','Featured'],['fav','Favourites']].map(a=>opt(a[0],UI.show,a[1])).join('')}</select>
<div class="seg"><button data-a="lay" data-v="grid" title="Grid">▦</button><button data-a="lay" data-v="list" title="List">☰</button></div></div><div id="res"></div>`;
app.querySelectorAll('#q,#fc,#ft,#fs,#fv').forEach(e=>e.oninput=()=>{Object.assign(UI,{q:$('#q').value,cat:$('#fc').value,tech:$('#ft').value,sort:$('#fs').value,show:$('#fv').value});SV('pv.ui',UI);results()});results()}
function results(){const q=UI.q.toLowerCase();let L=P.map(vm).filter(x=>(!q||[x.repo,x.owner,x.desc,x.cat,...x.techs].join(' ').toLowerCase().includes(q))&&(!UI.cat||x.cat===UI.cat)&&(!UI.tech||x.techs.includes(UI.tech))&&(UI.show!=='feat'||x.feat)&&(UI.show!=='fav'||x.fav));
const S={stars:(a,b)=>(b.r.stargazers_count||0)-(a.r.stargazers_count||0),new:(a,b)=>b.added-a.added,upd:(a,b)=>new Date(b.r.pushed_at||0)-new Date(a.r.pushed_at||0)};
if(UI.sort!=='manual')L.sort((a,b)=>(!!b.feat-!!a.feat)||S[UI.sort](a,b));
$('#res').className='grid'+(UI.layout==='list'?' list':'');$('#res').innerHTML=L.length?L.map(x=>card(x)).join(''):'<div class="empty">No projects match your filters.</div>';
app.querySelectorAll('[data-a=lay]').forEach(b=>{b.classList.toggle('on',b.dataset.v===UI.layout);b.setAttribute('aria-pressed',b.dataset.v===UI.layout)});reveal()}
// ---- Add
function addView(){draft=null;app.innerHTML=`<h1>Add Project</h1><p class="sub">Paste a public GitHub repository URL. Nothing is downloaded or copied, only public metadata is read.</p><div class="panel"><div class="frow"><input id="u" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://github.com/Code-NameCode/goodstuff-fun-site"><button class="btn" id="ps" type="button">PASTE</button><button class="btn pri" id="go" type="button">FETCH REPOSITORY</button></div><div id="pv"></div></div>`;
$('#go').onclick=fetchDraft;$('#u').onkeydown=e=>{if(e.key==='Enter')fetchDraft()};
$('#ps').onclick=async()=>{try{$('#u').value=await navigator.clipboard.readText();fetchDraft()}catch{toast('Clipboard blocked by your browser. Click the box and press Ctrl+V.','er')}}}
const err=(el,m)=>el.innerHTML=`<div class="msg er">${esc(m)}</div>`;
async function fetchDraft(){const el=$('#pv'),p=parse($('#u').value);
if(!p)return err(el,'That is not a valid GitHub repository URL. Use the form https://github.com/owner/repository');
if(P.some(x=>key(x)===key(p)))return err(el,'This repository is already in your showcase.');
el.innerHTML='<div class="sk"></div>';
try{const d=await load(p.owner,p.repo,true),R=d.repo;if(P.some(x=>key(x)===key({owner:R.owner,repo:R.name})))return err(el,'This repository is already in your showcase.');
draft={url:R.html_url,owner:R.owner,repo:R.name,desc:'',cat:'',tags:[],thumb:'',demo:'',feat:false,fav:false,added:Date.now()};const x=vm(draft);
el.innerHTML=`<div class="prev"><div>${card(x,1)}</div><div class="f"><b>Review before saving</b><label>Category (detected: ${esc(x.cat)})</label><select id="dc"><option value="">Auto-detect</option>${CATS.map(c=>opt(c,'')).join('')}</select>
<label><input type="checkbox" id="df" style="width:auto"> Mark as featured</label><label>README preview</label><div class="readme" style="max-height:280px;overflow:auto">${d.readmeHtml||'No README found.'}</div>
<div class="acts" style="margin-top:16px"><button class="btn pri" id="sv">SAVE TO VAULT</button><button class="btn" id="cx">CANCEL</button></div></div></div>`;
$('#cx').onclick=addView;$('#sv').onclick=()=>{if(P.some(q=>key(q)===key(draft)))return toast('Already in your showcase','er');draft.cat=$('#dc').value;draft.feat=$('#df').checked;P.push(draft);SV('pv.projects',P);toast('Added '+draft.repo);location.hash='#/'}}
catch(e){err(el,e.message)}}
// ---- Detail
function detail(o,r){const p=P.find(x=>key(x)===(o+'/'+r).toLowerCase());if(!p){app.innerHTML='<div class="empty">Project not found. <a class="back" href="#/">Back to gallery</a></div>';return}
const x=vm(p),R=x.r;app.innerHTML=`<a class="back" href="#/">← Back to gallery</a><div class="hero">${thumb(x)}<div><span class="chip">${esc(x.cat)}</span> ${x.feat?'<span class="star">★ Featured</span>':''}<h1 style="margin-top:10px">${esc(x.repo)}</h1><div class="own">by ${esc(x.owner)}${R.fork?' · fork':''}${R.archived?' · archived':''}</div><p>${esc(x.desc)}</p>
<div class="acts">${ext(x.url,'VIEW PROJECT','btn pri')}${x.demo?ext(x.demo,'LIVE DEMO'):'<span class="nodemo">No live demo available</span>'}<button class="btn" data-a="refresh" data-k="${key(x)}">REFRESH</button></div></div></div>
<div class="stats"><div class="stat"><b>★ ${num(R.stargazers_count)}</b><small>Stars</small></div><div class="stat"><b>⑂ ${num(R.forks_count)}</b><small>Forks</small></div><div class="stat"><b>${num(R.subscribers_count)}</b><small>Watchers</small></div><div class="stat"><b>${num(R.open_issues_count)}</b><small>Open issues</small></div></div>
<div class="panel"><b>Technology stack</b><div class="tags" style="margin-top:10px">${x.techs.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'–'}</div></div>
<div class="panel"><b>GitHub activity</b><p class="own" style="margin:8px 0 0">Last pushed ${fdate(R.pushed_at)} (${ago(R.pushed_at)}) · Created ${fdate(R.created_at)} · Default branch <code>${esc(R.default_branch||'–')}</code> · License ${esc(R.license||'none')} · Added to vault ${fdate(x.added)}</p></div>
<div class="panel"><b>Links</b><p class="own" style="margin:8px 0 0">Source: ${ext(x.url,esc(x.url),'star')}${x.demo?' · Homepage: '+ext(x.demo,esc(x.demo),'star'):''}</p></div>
<div class="panel"><div class="row"><b>README</b><span class="sp"></span>${ext(x.url+'#readme','VIEW ON GITHUB','btn sm')}</div><div class="readme" style="margin-top:16px">${x.d.readmeHtml||(x.d.readme?'<p>Press Refresh to load this project\'s formatted README.</p>':'No README available.')}</div></div>`}
// ---- Manage
function manage(){app.innerHTML=`<h1>Manage Collection</h1><p class="sub">Removing a project only removes it from this showcase. Nothing on GitHub is touched. <a class="star" href="#/add">+ Add a repository</a></p>
<div class="acts" style="margin:0 0 18px"><button class="btn" data-a="export">EXPORT INDEX (JSON)</button><label class="btn" style="margin:0">IMPORT INDEX<input type="file" accept=".json" id="imp" hidden></label></div>
${P.map((p,i)=>{const x=vm(p);return`<details class="mg" data-k="${key(p)}"><summary><b>${esc(x.repo)}</b><span class="chip">${esc(x.cat)}</span>${x.feat?'<span class="star">★</span>':''}<span class="sp"></span><button class="ic" data-a="up" data-k="${key(p)}">↑</button><button class="ic" data-a="down" data-k="${key(p)}">↓</button></summary>
<div class="f"><label>Description override</label><textarea data-f="desc" rows="3" placeholder="${esc(x.r.description||'')}">${esc(p.desc)}</textarea>
<label>Category</label><select data-f="cat"><option value="">Auto (${esc(x.d.repo?classify(x.d):'Other')})</option>${CATS.map(c=>opt(c,p.cat)).join('')}</select>
<label>Custom tags (comma separated)</label><input data-f="tags" value="${esc((p.tags||[]).join(', '))}"><label>Custom thumbnail URL</label><input data-f="thumb" value="${esc(p.thumb)}" placeholder="https://…">
<label>Live demo URL (overrides GitHub homepage)</label><input data-f="demo" value="${esc(p.demo)}" placeholder="${esc(x.r.homepage||'https://…')}"><label><input type="checkbox" data-f="feat" ${p.feat?'checked':''} style="width:auto"> Featured</label>
<div class="acts" style="margin-top:14px"><button class="btn pri" data-a="save" data-k="${key(p)}">SAVE CHANGES</button><button class="btn" data-a="refresh" data-k="${key(p)}">REFRESH FROM GITHUB</button><button class="btn dan" data-a="remove" data-k="${key(p)}">REMOVE FROM SHOWCASE</button></div></div></details>`}).join('')||'<div class="empty">Nothing here yet.</div>'}`;
const f=$('#imp');if(f)f.onchange=async()=>{try{const a=JSON.parse(await f.files[0].text());let n=0;for(const q of a){const s=parse(q.url||'');if(s&&!P.some(z=>key(z)===key(s))){P.push({url:`https://github.com/${s.owner}/${s.repo}`,owner:s.owner,repo:s.repo,desc:q.desc||'',cat:q.cat||'',tags:q.tags||[],thumb:q.thumb||'',demo:q.demo||'',feat:!!q.feat,fav:!!q.fav,added:q.added||Date.now()});n++}}SV('pv.projects',P);toast(n+' project(s) imported. Use Refresh to load their GitHub data.');manage()}catch{toast('Invalid JSON index','er')}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,i=P.findIndex(p=>key(p)===k),p=P[i];
if(a==='lay'){UI.layout=b.dataset.v;SV('pv.ui',UI);results()}
else if(a==='fav'){p.fav=!p.fav;SV('pv.projects',P);b.classList.toggle('on',p.fav)}
else if(a==='save'){const d=b.closest('details'),g=n=>d.querySelector(`[data-f=${n}]`),dm=g('demo').value.trim(),th=g('thumb').value.trim();
if((dm&&!/^https?:\/\//i.test(dm))||(th&&!safe(th)))return toast('Demo and thumbnail must be valid http(s) URLs','er');
Object.assign(p,{desc:g('desc').value.trim(),cat:g('cat').value,tags:g('tags').value.split(',').map(s=>s.trim()).filter(Boolean),thumb:th,demo:dm,feat:g('feat').checked});SV('pv.projects',P);toast('Saved');manage()}
else if(a==='refresh'){b.disabled=true;b.textContent='REFRESHING…';try{await load(p.owner,p.repo,true);toast('Refreshed from GitHub. Your custom edits were kept.')}catch(x){toast(x.message,'er')}route()}
else if(a==='remove'){if(confirm(`Remove ${p.repo} from your showcase? Nothing on GitHub will be changed.`)){P.splice(i,1);SV('pv.projects',P);delete C[k];SV('pv.cache',C);toast('Removed from showcase');manage()}}
else if(a==='up'||a==='down'){e.preventDefault();const j=i+(a==='up'?-1:1);if(j>=0&&j<P.length){[P[i],P[j]]=[P[j],P[i]];SV('pv.projects',P);manage()}}
else if(a==='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:'application/json'}));l.download='project-vault-index.json';l.click()}});
function route(){const h=location.hash.slice(1)||'/',m=h.match(/^\/p\/([^/]+)\/([^/]+)$/);document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+(m?'/':h)?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
m?detail(m[1],m[2]):h==='/add'?addView():h==='/manage'?manage():gallery();reveal()}
const nt=$('.nav-toggle'),nl=$('#nl');nt.onclick=()=>nt.setAttribute('aria-expanded',nl.classList.toggle('open'));nl.onclick=e=>{if(e.target.closest('a'))nl.classList.remove('open')};
addEventListener('scroll',()=>$('header').classList.toggle('gs-scrolled',scrollY>12),{passive:true});
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08}):null;
function reveal(){document.querySelectorAll('.reveal:not(.in)').forEach((e,i)=>{e.style.setProperty('--gs-delay',Math.min(i%12,7)*60+'ms');io?io.observe(e):e.classList.add('in')});setTimeout(()=>document.querySelectorAll('.reveal:not(.in)').forEach(e=>e.classList.add('in')),2500)}
document.addEventListener('click',e=>{const a=e.target.closest('.readme a[href^="#"]');if(!a)return;e.preventDefault();const h=decodeURIComponent(a.getAttribute('href').slice(1)),t=document.getElementById(h)||document.getElementById('user-content-'+h.replace(/^user-content-/,''));t&&t.scrollIntoView({behavior:'smooth',block:'start'})});
addEventListener('hashchange',()=>{scrollTo(0,0);route()});route();
</script></body></html>
